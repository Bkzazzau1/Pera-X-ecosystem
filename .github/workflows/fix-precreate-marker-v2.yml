name: Fix Precreation Marker V2

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'verify/apc-settlement-completion-20260719'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify/apc-settlement-completion-20260719
          fetch-depth: 0
      - name: Correct the stable settlement marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/precreate-policy-vaults.yml')
          text = path.read_text()
          old = "              '    require_keys_eq!(ctx.accounts.pex_mint.key(), ctx.accounts.settlement_policy.pex_mint, crate::PeraxError::InvalidTokenMint);\\n',"
          new = "              'pub fn plan_settlement(ctx: Context<PlanSettlementV2>, params: PlanSettlementParams) -> Result<()> {\\n',"
          if new not in text:
              if old not in text:
                  raise SystemExit('Exact current marker was not found')
              path.write_text(text.replace(old, new, 1))
          PY
          git add .github/workflows/precreate-policy-vaults.yml
          if git diff --cached --quiet; then
            echo 'Marker is already corrected.'
            exit 0
          fi
          git config user.name 'Pera-X verification automation'
          git config user.email 'actions@github.com'
          git commit -m 'Use stable plan settlement marker for vault validation'
          git push origin HEAD:verify/apc-settlement-completion-20260719
