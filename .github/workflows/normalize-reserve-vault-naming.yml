name: Normalize reserve vault naming

on:
  push:
    branches:
      - agent/reserve-vault-custody-v2

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reserve-vault-custody-v2
      - name: Remove development version labels
        run: |
          sed -i 's/release_record_v2/release_record/g' perax-contracts/programs/perax-core/src/contexts.rs
          sed -i 's/release_record_v2/release_record/g' perax-contracts/programs/perax-core/src/instructions/vault.rs
          sed -i 's/releaseRecordV2/releaseRecord/g' perax-contracts/tests/perax-core.ts
          git rm .github/workflows/normalize-reserve-vault-naming.yml
      - name: Commit normalized naming
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add perax-contracts/programs/perax-core/src/contexts.rs perax-contracts/programs/perax-core/src/instructions/vault.rs perax-contracts/tests/perax-core.ts
          git commit -m 'Normalize reserve vault development naming'
          git push origin HEAD:agent/reserve-vault-custody-v2
