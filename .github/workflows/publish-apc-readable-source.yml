name: Apply APC TypeScript corrections

on:
  push:
    branches: [agent/apc-source-snapshot]
    paths:
      - ".github/scripts/fix-apc-typescript.py"
      - ".github/workflows/publish-apc-readable-source.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/fix-apc-typescript.py"
      - ".github/workflows/publish-apc-readable-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout correction source
        uses: actions/checkout@v4
        with:
          ref: agent/apc-source-snapshot
          fetch-depth: 0

      - name: Preserve correction script
        run: cp .github/scripts/fix-apc-typescript.py /tmp/fix-apc-typescript.py

      - name: Switch to APC implementation branch
        run: |
          git fetch origin agent/adaptive-price-control
          git switch -C agent/adaptive-price-control origin/agent/adaptive-price-control
          test "$(git rev-parse HEAD)" = "8780ed6b4d486d54470db77ca15e8e6973b1c8e1"

      - name: Apply guarded TypeScript corrections
        run: python3 /tmp/fix-apc-typescript.py

      - name: Validate TypeScript
        working-directory: perax-contracts
        run: |
          npm install
          npm run typecheck

      - name: Commit and push corrections
        run: |
          git diff --check
          git add perax-contracts/tests/perax-core.ts
          git config user.name "Pera-X APC automation"
          git config user.email "actions@github.com"
          git commit -m "Fix APC transaction test typing"
          git push origin agent/adaptive-price-control
