name: Publish APC readable source

on:
  push:
    branches: [agent/apc-source-snapshot]
    paths:
      - ".github/apc-final/**"
      - ".github/workflows/publish-apc-readable-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout validation source
        uses: actions/checkout@v4
        with:
          ref: agent/apc-source-snapshot
          fetch-depth: 0

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.79.0
        with:
          components: rustfmt

      - name: Preserve and verify source patches
        shell: bash
        run: |
          set -euo pipefail
          cat .github/apc-patch/part*.patch > /tmp/apc-base.patch
          cp .github/apc-fixes/fix01.patch /tmp/apc-fix01.patch
          cat .github/apc-final/part*.patch > /tmp/apc-final.patch
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('/tmp/apc-base.patch')
          data = path.read_bytes()
          replacements = [
              (b'pub last _release_timestamp', b'pub last_release_timestamp'),
              (b'require!(next  <= cap', b'require!(next <= cap'),
              (
                  b'+       ),\n+        PeraxError::InvalidApcStatus',
                  b'+        ),\n+        PeraxError::InvalidApcStatus',
              ),
          ]
          for old, new in replacements:
              if data.count(old) != 1:
                  raise SystemExit(f'unexpected APC base-patch boundary: {old!r}')
              data = data.replace(old, new)
          expected = 'b61d4f0a0c732f40aaa31d0b15b682dc4b058bee964e948f50f09aecc4a3230c'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'base patch digest mismatch: {actual}')
          path.write_bytes(data)
          PY
          echo 'e752f07cb5854171cfefb51650f6c1a7604bc4e3a9218b36ce935f0851ebae43  /tmp/apc-fix01.patch' | sha256sum --check
          echo '30d405a091a6e6f1843ccfa9e683a1f841cb9085139d6ec83cb56683cdfdb81a  /tmp/apc-final.patch' | sha256sum --check

      - name: Reconstruct readable implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/adaptive-price-control
          git switch agent/adaptive-price-control
          test "$(git rev-parse HEAD)" = "67036d6a2bbabb9801359dc627f5c1a5bd913507"
          git apply --check /tmp/apc-base.patch
          git apply /tmp/apc-base.patch
          git apply --check /tmp/apc-fix01.patch
          git apply /tmp/apc-fix01.patch
          (cd perax-contracts && cargo +1.79.0 fmt --all)
          git apply --check /tmp/apc-final.patch
          git apply /tmp/apc-final.patch
          git diff --check

      - name: Generate Rust 1.79-compatible lockfile
        working-directory: perax-contracts
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal
          rm -f Cargo.lock
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo +1.85.0 generate-lockfile
          cargo +1.85.0 update -p blake3 --precise 1.5.0

      - name: Validate source before publishing
        shell: bash
        run: |
          set -euo pipefail
          cd perax-contracts
          node scripts/validate-tokenomics.js
          cargo +1.79.0 fmt --all
          cargo +1.79.0 fmt --all -- --check
          cargo +1.79.0 test --locked --all-targets
          cargo +1.79.0 check --locked --all-targets
          cd ../perax-market-engine
          npm ci
          npm run typecheck
          npm test

      - name: Commit readable APC source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -A
          git config user.name "Pera-X APC automation"
          git config user.email "actions@github.com"
          git commit -m "Implement adaptive price control"
          git push origin agent/adaptive-price-control
