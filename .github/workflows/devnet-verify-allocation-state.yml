name: Devnet Verify Allocation State

on:
  workflow_dispatch:

jobs:
  verify-allocation-state:
    name: Verify devnet PEX allocation balances
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: perax-contracts

    env:
      SOLANA_CLUSTER: devnet
      SOLANA_RPC_URL: https://api.devnet.solana.com
      SOLANA_KEYPAIR_PATH: .local/devnet-deployer.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux packages required for SPL Token CLI
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libusb-1.0-0-dev

      - name: Install Solana CLI
        shell: bash
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install SPL Token CLI
        shell: bash
        run: |
          cargo install spl-token-cli --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Restore devnet deployer keypair
        shell: bash
        env:
          DEVNET_DEPLOYER_KEYPAIR_JSON: ${{ secrets.DEVNET_DEPLOYER_KEYPAIR_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$DEVNET_DEPLOYER_KEYPAIR_JSON" ]; then
            echo "Missing DEVNET_DEPLOYER_KEYPAIR_JSON secret"
            exit 1
          fi

          mkdir -p .local
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          raw = os.environ.get('DEVNET_DEPLOYER_KEYPAIR_JSON', '').strip()
          try:
              data = json.loads(raw)
          except json.JSONDecodeError as exc:
              print(f'DEVNET_DEPLOYER_KEYPAIR_JSON is not valid JSON array: {exc}')
              sys.exit(1)
          if not isinstance(data, list) or not all(isinstance(x, int) for x in data) or len(data) != 64:
              print('DEVNET_DEPLOYER_KEYPAIR_JSON must be a 64-integer Solana keypair JSON array.')
              sys.exit(1)
          Path('.local/devnet-deployer.json').write_text(json.dumps(data), encoding='utf-8')
          PY
          chmod 600 .local/devnet-deployer.json

      - name: Verify allocation state
        shell: bash
        run: |
          node scripts/verify-devnet-allocation-state.js | tee devnet-allocation-verification-output.txt

      - name: Upload verification output
        uses: actions/upload-artifact@v4
        with:
          name: devnet-allocation-verification-output
          path: perax-contracts/devnet-allocation-verification-output.txt
