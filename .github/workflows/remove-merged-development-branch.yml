name: Remove merged development branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Delete merged source branch
        run: git push origin --delete agent/reserve-vault-custody-v2
      - name: Remove this one-time workflow
        run: |
          git rm .github/workflows/remove-merged-development-branch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary branch cleanup workflow'
          git push origin HEAD:main
