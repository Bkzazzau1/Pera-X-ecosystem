name: Apply Approved Market CPI Hardening

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/apply-approved-market-cpi.py"
      - ".github/workflows/apply-approved-market-cpi.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Rust 1.79
        uses: dtolnay/rust-toolchain@1.79.0
        with:
          components: rustfmt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            perax-contracts/package-lock.json
            perax-market-engine/package-lock.json

      - name: Apply exact guarded transformation
        run: python3 .github/scripts/apply-approved-market-cpi.py

      - name: Format and verify Rust contract
        working-directory: perax-contracts
        run: |
          cargo +1.79.0 fmt --all
          cargo +1.79.0 fmt --all -- --check
          cargo +1.79.0 test --locked --all-targets
          cargo +1.79.0 check --locked --all-targets

      - name: Validate contract policy and TypeScript
        working-directory: perax-contracts
        run: |
          npm ci
          npm run validate:tokenomics
          npm run validate:settlement
          npm run typecheck

      - name: Verify market engine remains clean
        working-directory: perax-market-engine
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Commit verified source to main
        run: |
          git diff --check
          git add perax-contracts
          if git diff --cached --quiet; then
            echo "No contract transformation remained to commit."
            exit 0
          fi
          git config user.name "Pera-X policy automation"
          git config user.email "actions@github.com"
          git commit -m "Enforce approved exact-out market CPI"
          git push origin HEAD:main
