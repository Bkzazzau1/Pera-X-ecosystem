name: Materialize Meteora Runtime V2

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'verify/apc-settlement-completion-20260719'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify/apc-settlement-completion-20260719
          fetch-depth: 0

      - name: Restore reviewed transparent runtime
        run: |
          git show 8f56b64d57af30cfcb2590b816ba576b09a86e05:.github/scripts/install-meteora-runtime.py > /tmp/install.py
          git show 8f56b64d57af30cfcb2590b816ba576b09a86e05:perax-market-adapters/meteora-dlmm-runtime/generated/package-lock.gz.b64.001 > /tmp/lock.001
          git show 8f56b64d57af30cfcb2590b816ba576b09a86e05:perax-market-adapters/meteora-dlmm-runtime/generated/package-lock.gz.b64.002 > /tmp/lock.002
          python3 /tmp/install.py
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          payload = Path('/tmp/lock.001').read_text() + Path('/tmp/lock.002').read_text()
          Path('perax-market-adapters/meteora-dlmm-runtime/package-lock.json').write_bytes(
              gzip.decompress(base64.b64decode(payload))
          )
          PY
          node - <<'NODE'
          const fs = require('fs');
          const path = 'perax-market-adapters/meteora-dlmm-runtime/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          delete pkg.scripts.bootstrap;
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          rm -f .github/scripts/install-meteora-runtime.py
          rm -rf perax-market-adapters/meteora-dlmm-runtime/scripts
          rm -rf perax-market-adapters/meteora-dlmm-runtime/generated

      - name: Commit reviewed files
        run: |
          git add -u
          git add -f \
            perax-market-adapters/meteora-dlmm-runtime/src \
            perax-market-adapters/meteora-dlmm-runtime/test \
            perax-market-adapters/meteora-dlmm-runtime/package-lock.json \
            perax-market-adapters/meteora-dlmm-runtime/tsconfig.json \
            perax-market-adapters/meteora-dlmm-runtime/vendor
          git add perax-market-adapters/meteora-dlmm-runtime/package.json perax-market-adapters/meteora-dlmm-runtime/README.md
          if git diff --cached --quiet; then
            echo 'Transparent runtime is already committed.'
            exit 0
          fi
          git config user.name 'Pera-X verification automation'
          git config user.email 'actions@github.com'
          git commit -m 'Force-add reviewed Meteora runtime files'
          git push origin HEAD:verify/apc-settlement-completion-20260719
