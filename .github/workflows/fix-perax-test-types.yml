name: Repair Anchor test TypeScript types

# Triggered after workflow creation so GitHub Actions evaluates the repair job.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-perax-test-types.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: perax-contracts
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Patch test typing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/perax-core.ts")
          text = path.read_text()

          allocation_type = '''type AllocationDefinition = {
            key: string;
            vaultClass: Record<string, Record<string, never>>;
            releasable: boolean;
          };
          '''
          replacement_allocation_type = '''type AllocationDefinition = {
            key: string;
            vaultClass: Record<string, Record<string, never>>;
            releasable: boolean;
          };

          type InitializationOverrides = Partial<{
            allocationId: number[];
            vaultClass: Record<string, Record<string, never>>;
            allocationCap: anchor.BN;
            authorizedSourceOwner: anchor.web3.PublicKey;
            authorizedSourceTokenAccount: anchor.web3.PublicKey;
            approvedDestinationOwner: anchor.web3.PublicKey;
            approvedDestinationTokenAccount: anchor.web3.PublicKey;
          }>;

          type ReserveVaultConfigAccount = {
            authorizedDeposited: anchor.BN;
            unsolicitedBalance: anchor.BN;
            totalReleased: anchor.BN;
          };

          type ReserveReleaseRecordAccount = {
            destinationTokenAccount: anchor.web3.PublicKey;
          };
          '''
          if text.count(allocation_type) != 1:
              raise SystemExit("AllocationDefinition insertion point changed")
          text = text.replace(allocation_type, replacement_allocation_type)

          program_line = '  const program = anchor.workspace.PeraxCore as Program<any>;\n'
          program_replacement = '''  const program = anchor.workspace.PeraxCore as Program<any>;
            const programAccounts = program.account as unknown as {
              reserveVaultConfig: {
                all(): Promise<
                  Array<{
                    publicKey: anchor.web3.PublicKey;
                    account: ReserveVaultConfigAccount;
                  }>
                >;
                fetch(
                  address: anchor.web3.PublicKey
                ): Promise<ReserveVaultConfigAccount>;
              };
              reserveReleaseRecord: {
                fetch(
                  address: anchor.web3.PublicKey
                ): Promise<ReserveReleaseRecordAccount>;
              };
            };
          '''
          if text.count(program_line) != 1:
              raise SystemExit("Program declaration insertion point changed")
          text = text.replace(program_line, program_replacement)

          inline_overrides = '''    overrides: Partial<{
                allocationId: number[];
                vaultClass: Record<string, Record<string, never>>;
                allocationCap: anchor.BN;
                authorizedSourceOwner: anchor.web3.PublicKey;
                authorizedSourceTokenAccount: anchor.web3.PublicKey;
                approvedDestinationOwner: anchor.web3.PublicKey;
                approvedDestinationTokenAccount: anchor.web3.PublicKey;
              }> = {}
          '''
          if text.count(inline_overrides) != 1:
              raise SystemExit("Inline initialization override type changed")
          text = text.replace(
              inline_overrides,
              '    overrides: InitializationOverrides = {}\n',
          )

          recursive_type = '    overrides: Parameters<typeof buildInitialization>[1] = {}\n'
          if text.count(recursive_type) != 1:
              raise SystemExit("Recursive helper type changed")
          text = text.replace(
              recursive_type,
              '    overrides: InitializationOverrides = {}\n',
          )

          vault_count = text.count("program.account.reserveVaultConfig")
          release_count = text.count("program.account.reserveReleaseRecord")
          if vault_count != 4:
              raise SystemExit(f"Expected 4 reserveVaultConfig accesses, found {vault_count}")
          if release_count != 1:
              raise SystemExit(f"Expected 1 reserveReleaseRecord access, found {release_count}")

          text = text.replace(
              "program.account.reserveVaultConfig",
              "programAccounts.reserveVaultConfig",
          )
          text = text.replace(
              "program.account.reserveReleaseRecord",
              "programAccounts.reserveReleaseRecord",
          )

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm install

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Commit repair and remove workflow
        shell: bash
        working-directory: .
        run: |
          git rm .github/workflows/fix-perax-test-types.yml
          git add perax-contracts/tests/perax-core.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: stabilize Anchor account typings'
          git push origin HEAD:main
