name: Repair Anchor test TypeScript types

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-perax-test-types.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply deterministic typing repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("perax-contracts/tests/perax-core.ts")
          text = path.read_text()

          allocation_marker = '''type AllocationDefinition = {
            key: string;
            vaultClass: Record<string, Record<string, never>>;
            releasable: boolean;
          };
          '''
          type_block = '''type AllocationDefinition = {
            key: string;
            vaultClass: Record<string, Record<string, never>>;
            releasable: boolean;
          };

          type InitializationOverrides = Partial<{
            allocationId: number[];
            vaultClass: Record<string, Record<string, never>>;
            allocationCap: anchor.BN;
            authorizedSourceOwner: anchor.web3.PublicKey;
            authorizedSourceTokenAccount: anchor.web3.PublicKey;
            approvedDestinationOwner: anchor.web3.PublicKey;
            approvedDestinationTokenAccount: anchor.web3.PublicKey;
          }>;

          type ReserveVaultConfigAccount = {
            authorizedDeposited: anchor.BN;
            unsolicitedBalance: anchor.BN;
            totalReleased: anchor.BN;
          };

          type ReserveReleaseRecordAccount = {
            destinationTokenAccount: anchor.web3.PublicKey;
          };
          '''
          if "type InitializationOverrides" not in text:
              if text.count(allocation_marker) != 1:
                  raise SystemExit("AllocationDefinition marker not found exactly once")
              text = text.replace(allocation_marker, type_block)

          program_marker = '  const program = anchor.workspace.PeraxCore as Program<any>;\n'
          account_adapter = '''  const program = anchor.workspace.PeraxCore as Program<any>;
            const programAccounts = program.account as unknown as {
              reserveVaultConfig: {
                all(): Promise<Array<{ account: ReserveVaultConfigAccount }>>;
                fetch(address: anchor.web3.PublicKey): Promise<ReserveVaultConfigAccount>;
              };
              reserveReleaseRecord: {
                fetch(address: anchor.web3.PublicKey): Promise<ReserveReleaseRecordAccount>;
              };
            };
          '''
          if "const programAccounts =" not in text:
              if text.count(program_marker) != 1:
                  raise SystemExit("Program marker not found exactly once")
              text = text.replace(program_marker, account_adapter)

          build_start = text.index("  async function buildInitialization(")
          build_end = text.index("  ) {", build_start)
          build_signature = text[build_start:build_end]
          override_start = build_signature.index("    overrides: Partial<{")
          override_end = build_signature.index("    }> = {}", override_start) + len("    }> = {}")
          build_signature = (
              build_signature[:override_start]
              + "    overrides: InitializationOverrides = {}"
              + build_signature[override_end:]
          )
          text = text[:build_start] + build_signature + text[build_end:]

          text = text.replace(
              "    overrides: Parameters<typeof buildInitialization>[1] = {}",
              "    overrides: InitializationOverrides = {}",
          )
          text = text.replace(
              "program.account.reserveVaultConfig",
              "programAccounts.reserveVaultConfig",
          )
          text = text.replace(
              "program.account.reserveReleaseRecord",
              "programAccounts.reserveReleaseRecord",
          )

          forbidden = [
              "Parameters<typeof buildInitialization>[1]",
              "program.account.reserveVaultConfig",
              "program.account.reserveReleaseRecord",
              "overrides: Partial<{",
          ]
          remaining = [item for item in forbidden if item in text]
          if remaining:
              raise SystemExit(f"Typing repair incomplete: {remaining}")

          path.write_text(text)
          PY

      - name: Commit repair and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-perax-test-types.yml
          git add perax-contracts/tests/perax-core.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: stabilize Anchor account typings'
          git push origin HEAD:main
