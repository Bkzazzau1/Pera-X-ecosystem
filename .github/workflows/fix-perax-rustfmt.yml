name: Repair Pera-X Rust formatting

# Trigger commit: apply rustfmt with the CI-pinned toolchain.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-perax-rustfmt.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.79.0
        with:
          components: rustfmt

      - name: Format contract workspace
        working-directory: perax-contracts
        run: cargo fmt --all

      - name: Verify formatting
        working-directory: perax-contracts
        run: cargo fmt --all -- --check

      - name: Commit formatting and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-perax-rustfmt.yml
          git add perax-contracts/programs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply rustfmt to Pera-X contracts'
          git push origin HEAD:main
