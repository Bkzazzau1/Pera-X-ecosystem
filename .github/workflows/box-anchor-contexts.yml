name: Box Anchor Accounts Safely

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'verify/apc-settlement-completion-20260719'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: verify/apc-settlement-completion-20260719
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.79.0
        with:
          components: rustfmt

      - name: Install Agave SBF tools
        shell: bash
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.14/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Box deserialized accounts in legacy contexts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('perax-contracts/programs/perax-core/src/contexts.rs')
          text = path.read_text()
          updated, count = re.subn(
              r"(pub\s+[A-Za-z0-9_]+:\s*)Account<'info,\s*([^>]+)>",
              r"\1Box<Account<'info, \2>>",
              text,
          )
          if count == 0:
              print('Legacy contexts are already boxed.')
          else:
              print(f'Boxed {count} Anchor account fields.')
              path.write_text(updated)
          PY
          cargo +1.79.0 fmt --manifest-path perax-contracts/programs/perax-core/Cargo.toml

      - name: Verify Rust source
        working-directory: perax-contracts
        run: |
          cargo +1.79.0 test --locked --manifest-path programs/perax-core/Cargo.toml
          cargo +1.79.0 check --locked --all-targets

      - name: Build SBF and capture remaining stack diagnostics
        working-directory: perax-contracts
        shell: bash
        run: |
          set -o pipefail
          RUSTUP_TOOLCHAIN=1.85.0 cargo build-sbf --manifest-path programs/perax-core/Cargo.toml --sbf-out-dir target/deploy 2>&1 | tee /tmp/boxed-sbf.log
          grep -E "Stack offset of [0-9]+ exceeded max offset|overwrites values in the frame" /tmp/boxed-sbf.log || true

      - name: Upload SBF diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boxed-anchor-sbf-diagnostics
          path: /tmp/boxed-sbf.log
          if-no-files-found: warn

      - name: Commit verified boxing repair
        shell: bash
        run: |
          git add perax-contracts/programs/perax-core/src/contexts.rs
          if git diff --cached --quiet; then
            echo 'No boxing change to commit.'
            exit 0
          fi
          git config user.name 'Pera-X verification automation'
          git config user.email 'actions@github.com'
          git commit -m 'Box Anchor accounts to reduce SBF stack usage'
          git push origin HEAD:verify/apc-settlement-completion-20260719
