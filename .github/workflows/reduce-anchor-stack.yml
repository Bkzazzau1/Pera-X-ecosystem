name: Reduce Remaining Anchor Stack Frames

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'verify/apc-settlement-completion-20260719'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: verify/apc-settlement-completion-20260719
          fetch-depth: 0

      - name: Set up Rust toolchains
        uses: dtolnay/rust-toolchain@1.79.0
        with:
          components: rustfmt

      - name: Install Cargo 1.85 and Agave SBF tools
        shell: bash
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.14/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Move complex Anchor constraints into explicit handlers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ROOT = Path('perax-contracts/programs/perax-core/src')

          def find_struct(text: str, name: str):
              marker = f'pub struct {name}'
              pos = text.index(marker)
              start = text.rfind('#[derive(Accounts)]', 0, pos)
              end = text.index('\n}', pos) + 2
              return start, end

          def split_top_level(content: str):
              parts, current = [], []
              paren = bracket = brace = 0
              for ch in content:
                  if ch == '(':
                      paren += 1
                  elif ch == ')':
                      paren -= 1
                  elif ch == '[':
                      bracket += 1
                  elif ch == ']':
                      bracket -= 1
                  elif ch == '{':
                      brace += 1
                  elif ch == '}':
                      brace -= 1
                  if ch == ',' and paren == bracket == brace == 0:
                      parts.append(''.join(current).strip())
                      current = []
                  else:
                      current.append(ch)
              tail = ''.join(current).strip()
              if tail:
                  parts.append(tail)
              return parts

          def strip_account_clauses(block: str, prefixes):
              out, cursor = [], 0
              needle = '#[account('
              while True:
                  start = block.find(needle, cursor)
                  if start < 0:
                      out.append(block[cursor:])
                      break
                  out.append(block[cursor:start])
                  i = start + len(needle)
                  depth = 1
                  while i < len(block) and depth:
                      if block[i] == '(':
                          depth += 1
                      elif block[i] == ')':
                          depth -= 1
                      i += 1
                  if depth != 0 or i >= len(block) or block[i] != ']':
                      raise RuntimeError('Unbalanced #[account(...)] attribute')
                  content = block[start + len(needle):i - 1]
                  clauses = split_top_level(content)
                  kept = [c for c in clauses if not any(c.strip().startswith(p) for p in prefixes)]
                  if not kept:
                      replacement = ''
                  elif len(kept) == 1 and '\n' not in kept[0]:
                      replacement = f'#[account({kept[0]})]'
                  else:
                      replacement = '#[account(\n        ' + ',\n        '.join(kept) + '\n    )]'
                  out.append(replacement)
                  cursor = i + 1
              return ''.join(out)

          contexts_path = ROOT / 'contexts.rs'
          contexts = contexts_path.read_text()
          for name, prefixes in [
              ('InitializeRecoveryPool', ('constraint =', 'address =')),
              ('InitializeApc', ('constraint =', 'address =')),
              ('ExecuteApcRelease', ('constraint =', 'address =', 'has_one =')),
              ('ExecuteCounterweightPurchase', ('constraint =', 'address =', 'has_one =')),
          ]:
              start, end = find_struct(contexts, name)
              block = contexts[start:end]
              block = strip_account_clauses(block, prefixes)
              if name == 'InitializeApc':
                  block = block.replace('#[instruction(params: InitializeApcParams)]\n', '')
              contexts = contexts[:start] + block + contexts[end:]
          contexts_path.write_text(contexts)

          settlement_path = ROOT / 'settlement_v2.rs'
          settlement = settlement_path.read_text()
          start, end = find_struct(settlement, 'PlanSettlementV2')
          block = strip_account_clauses(settlement[start:end], ('constraint =', 'address =', 'has_one ='))
          settlement_path.write_text(settlement[:start] + block + settlement[end:])

          def insert_once(path: Path, marker: str, insertion: str):
              text = path.read_text()
              if insertion.strip() in text:
                  return
              if marker not in text:
                  raise RuntimeError(f'Marker not found in {path}: {marker}')
              path.write_text(text.replace(marker, marker + insertion, 1))

          apc_path = ROOT / 'instructions' / 'apc.rs'
          insert_once(
              apc_path,
              'pub fn initialize_apc(ctx: Context<InitializeApc>, params: InitializeApcParams) -> Result<()> {\n',
              '''    require_keys_eq!(\n        ctx.accounts.token_mint.key(),\n        ctx.accounts.state.token_mint,\n        PeraxError::InvalidTokenMint\n    );\n    require_keys_eq!(\n        ctx.accounts.quote_mint.key(),\n        params.quote_mint,\n        PeraxError::InvalidCounterweightMint\n    );\n''',
          )
          insert_once(
              apc_path,
              '    require!(params.amount > 0, PeraxError::InvalidAmount);\n',
              '''    require_keys_eq!(ctx.accounts.token_mint.key(), ctx.accounts.state.token_mint, PeraxError::InvalidTokenMint);\n    require_keys_eq!(ctx.accounts.apc_config.oracle_feed, ctx.accounts.oracle_feed.key(), PeraxError::Unauthorized);\n    require_keys_eq!(ctx.accounts.apc_state.config, ctx.accounts.apc_config.key(), PeraxError::ApcNotInitialized);\n    require!(\n        ctx.accounts.observation.observation_id == params.observation_id\n            && ctx.accounts.observation.oracle_feed == ctx.accounts.oracle_feed.key(),\n        PeraxError::InvalidReference\n    );\n    require!(\n        ctx.accounts.band_record.band_index == params.band_index\n            && ctx.accounts.band_record.apc_state == ctx.accounts.apc_state.key(),\n        PeraxError::InvalidBandIndex\n    );\n    require!(\n        ctx.accounts.reserve_vault_config.state == ctx.accounts.state.key()\n            && ctx.accounts.reserve_vault_config.allocation_id == params.allocation_id\n            && ctx.accounts.reserve_vault_config.token_mint == ctx.accounts.token_mint.key(),\n        PeraxError::InvalidVaultConfiguration\n    );\n    require_keys_eq!(ctx.accounts.vault_authority.key(), ctx.accounts.reserve_vault_config.vault_authority, PeraxError::InvalidVaultAuthority);\n    require!(\n        ctx.accounts.vault_token_account.key() == ctx.accounts.reserve_vault_config.vault_token_account\n            && ctx.accounts.vault_token_account.owner == ctx.accounts.vault_authority.key()\n            && ctx.accounts.vault_token_account.mint == ctx.accounts.token_mint.key(),\n        PeraxError::InvalidVaultTokenAccount\n    );\n    require!(\n        ctx.accounts.destination_token_account.key() == ctx.accounts.reserve_vault_config.approved_destination_token_account\n            && ctx.accounts.destination_token_account.owner == ctx.accounts.reserve_vault_config.approved_destination_owner\n            && ctx.accounts.destination_token_account.mint == ctx.accounts.token_mint.key(),\n        PeraxError::InvalidApprovedDestination\n    );\n    require_keys_eq!(ctx.accounts.counterweight_config.apc_config, ctx.accounts.apc_config.key(), PeraxError::InvalidCounterweightVault);\n    require!(\n        ctx.accounts.counterweight_vault.key() == ctx.accounts.counterweight_config.counterweight_vault\n            && ctx.accounts.counterweight_vault.owner == ctx.accounts.counterweight_config.counterweight_authority\n            && ctx.accounts.counterweight_vault.mint == ctx.accounts.apc_config.quote_mint,\n        PeraxError::InvalidCounterweightVault\n    );\n''',
          )

          recovery_path = ROOT / 'instructions' / 'recovery.rs'
          insert_once(
              recovery_path,
              '    validate_reference(params.pool_id)?;\n',
              '''    require_keys_eq!(\n        ctx.accounts.pex_mint.key(),\n        ctx.accounts.state.token_mint,\n        PeraxError::InvalidTokenMint\n    );\n''',
          )

          hardened_path = ROOT / 'instructions' / 'hardened_market.rs'
          insert_once(
              hardened_path,
              '    require!(!ctx.accounts.state.is_paused, PeraxError::ProgramPaused);\n',
              '''    require_keys_eq!(ctx.accounts.state.token_mint, ctx.accounts.pex_mint.key(), PeraxError::InvalidTokenMint);\n    require_keys_eq!(ctx.accounts.apc_config.oracle_feed, ctx.accounts.oracle_feed.key(), PeraxError::Unauthorized);\n    require!(\n        ctx.accounts.observation.observation_id == params.observation_id\n            && ctx.accounts.observation.oracle_feed == ctx.accounts.oracle_feed.key(),\n        PeraxError::InvalidReference\n    );\n    require!(\n        ctx.accounts.counterweight_vault.key() == ctx.accounts.counterweight_config.counterweight_vault\n            && ctx.accounts.counterweight_vault.owner == ctx.accounts.counterweight_authority.key()\n            && ctx.accounts.counterweight_vault.mint == ctx.accounts.quote_mint.key(),\n        PeraxError::InvalidCounterweightVault\n    );\n    require!(\n        ctx.accounts.recovery_vault.key() == ctx.accounts.counterweight_config.recovery_vault\n            && ctx.accounts.recovery_vault.owner == ctx.accounts.counterweight_config.recovery_authority\n            && ctx.accounts.recovery_vault.mint == ctx.accounts.pex_mint.key(),\n        PeraxError::InvalidCounterweightVault\n    );\n    require_keys_eq!(ctx.accounts.quote_mint.key(), ctx.accounts.counterweight_config.quote_mint, PeraxError::InvalidCounterweightMint);\n    require_keys_eq!(ctx.accounts.approved_pool.key(), ctx.accounts.apc_config.approved_pool, PeraxError::InvalidApcPool);\n    require_keys_eq!(ctx.accounts.recovery_program.key(), ctx.accounts.apc_config.approved_recovery_program, PeraxError::InvalidRecoveryProgram);\n    require!(ctx.accounts.recovery_program.to_account_info().executable, PeraxError::InvalidRecoveryProgram);\n''',
          )

          plan_path = ROOT / 'instructions' / 'settlement_v2.rs'
          insert_once(
              plan_path,
              '    validate_reference(params.observation_id)?;\n',
              '''    require_keys_eq!(ctx.accounts.settlement_policy.state, ctx.accounts.state.key(), SettlementError::InvalidPolicy);\n    require!(\n        ctx.accounts.product_policy.settlement_policy == ctx.accounts.settlement_policy.key()\n            && ctx.accounts.product_policy.product_id == params.product_id,\n        SettlementError::InvalidPolicy\n    );\n    require_keys_eq!(ctx.accounts.apc_config.key(), ctx.accounts.settlement_policy.apc_config, SettlementError::InvalidPolicy);\n    require_keys_eq!(ctx.accounts.apc_state.config, ctx.accounts.apc_config.key(), crate::PeraxError::ApcNotInitialized);\n    require!(\n        ctx.accounts.observation.observation_id == params.observation_id\n            && ctx.accounts.observation.oracle_feed == ctx.accounts.apc_config.oracle_feed,\n        crate::PeraxError::InvalidReference\n    );\n    require_keys_eq!(ctx.accounts.pex_mint.key(), ctx.accounts.settlement_policy.pex_mint, crate::PeraxError::InvalidTokenMint);\n''',
          )
          PY
          cargo +1.79.0 fmt --manifest-path perax-contracts/programs/perax-core/Cargo.toml

      - name: Verify Rust and permanent guards
        working-directory: perax-contracts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run validate:settlement
          cargo +1.79.0 test --locked --manifest-path programs/perax-core/Cargo.toml
          cargo +1.79.0 check --locked --all-targets

      - name: Build SBF and report remaining frames
        working-directory: perax-contracts
        shell: bash
        run: |
          set -o pipefail
          RUSTUP_TOOLCHAIN=1.85.0 cargo build-sbf --manifest-path programs/perax-core/Cargo.toml --sbf-out-dir target/deploy 2>&1 | tee /tmp/targeted-sbf.log
          grep -E "Stack offset of [0-9]+ exceeded max offset|overwrites values in the frame" /tmp/targeted-sbf.log || true

      - name: Upload targeted SBF diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-anchor-sbf-diagnostics
          path: /tmp/targeted-sbf.log
          if-no-files-found: warn

      - name: Commit verified targeted repair
        shell: bash
        run: |
          git add \
            perax-contracts/programs/perax-core/src/contexts.rs \
            perax-contracts/programs/perax-core/src/settlement_v2.rs \
            perax-contracts/programs/perax-core/src/instructions/apc.rs \
            perax-contracts/programs/perax-core/src/instructions/recovery.rs \
            perax-contracts/programs/perax-core/src/instructions/hardened_market.rs \
            perax-contracts/programs/perax-core/src/instructions/settlement_v2.rs
          if git diff --cached --quiet; then
            echo 'No targeted stack change to commit.'
            exit 0
          fi
          git config user.name 'Pera-X verification automation'
          git config user.email 'actions@github.com'
          git commit -m 'Move complex Anchor constraints into explicit handlers'
          git push origin HEAD:verify/apc-settlement-completion-20260719
