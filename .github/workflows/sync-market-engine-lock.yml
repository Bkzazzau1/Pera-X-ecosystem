name: Synchronize Market Engine Lock

on:
  push:
    branches: [main]
    paths:
      - "perax-market-engine/package.json"
      - ".github/workflows/sync-market-engine-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: perax-market-engine
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: perax-market-engine/package-lock.json

      - name: Regenerate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean installation
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Market engine lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Synchronize market engine dependency lock"
          git push origin HEAD:main
