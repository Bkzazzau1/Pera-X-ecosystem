name: Validate APC source implementation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apc-source-snapshot.yml'
      - '.github/apc-patch/**'
      - '.github/apc-fixes/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.79.0
        with:
          components: rustfmt

      - name: Apply APC source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/apc-patch/part*.patch > /tmp/apc.patch
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('/tmp/apc.patch')
          data = path.read_bytes()
          replacements = [
              (b'pub last _release_timestamp', b'pub last_release_timestamp'),
              (b'require!(next  <= cap', b'require!(next <= cap'),
              (
                  b'+       ),\n+        PeraxError::InvalidApcStatus',
                  b'+        ),\n+        PeraxError::InvalidApcStatus',
              ),
          ]
          for old, new in replacements:
              if data.count(old) != 1:
                  raise SystemExit(f'unexpected APC patch transport boundary for {old!r}')
              data = data.replace(old, new)
          digest = hashlib.sha256(data).hexdigest()
          expected = 'b61d4f0a0c732f40aaa31d0b15b682dc4b058bee964e948f50f09aecc4a3230c'
          if digest != expected:
              raise SystemExit(f'APC patch digest mismatch: {digest}')
          path.write_bytes(data)
          PY
          git apply --check /tmp/apc.patch
          git apply /tmp/apc.patch

          echo 'e752f07cb5854171cfefb51650f6c1a7604bc4e3a9218b36ce935f0851ebae43  .github/apc-fixes/fix01.patch' | sha256sum --check
          cat .github/apc-fixes/fix*.patch > /tmp/apc-fixes.patch
          git apply --check /tmp/apc-fixes.patch
          git apply /tmp/apc-fixes.patch
          git diff --check

      - name: Regenerate Rust 1.79 compatible lockfile
        working-directory: perax-contracts
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal
          rm -f Cargo.lock
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo +1.85.0 generate-lockfile
          cargo +1.85.0 update -p blake3 --precise 1.5.0

      - name: Format APC source
        working-directory: perax-contracts
        shell: bash
        run: |
          cargo +1.79.0 fmt --all
          cargo +1.79.0 fmt --all -- --check

      - name: Run Rust unit tests
        working-directory: perax-contracts
        shell: bash
        run: |
          set -o pipefail
          cargo +1.79.0 test --locked --all-targets 2>&1 | tee /tmp/apc-cargo-test.log

      - name: Check Rust contracts
        working-directory: perax-contracts
        shell: bash
        run: |
          set -o pipefail
          cargo +1.79.0 check --locked --all-targets 2>&1 | tee /tmp/apc-cargo-check.log

      - name: Package patched source
        if: always()
        shell: bash
        run: |
          tar -czf /tmp/apc-patched-source.tar.gz perax-contracts/programs/perax-core/src perax-contracts/programs/perax-core/Cargo.toml perax-contracts/Cargo.lock

      - name: Upload APC validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apc-source-validation
          path: |
            /tmp/apc.patch
            /tmp/apc-fixes.patch
            /tmp/apc-cargo-test.log
            /tmp/apc-cargo-check.log
            /tmp/apc-patched-source.tar.gz
          if-no-files-found: warn
