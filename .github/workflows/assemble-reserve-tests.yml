name: Assemble reserve vault tests

on:
  push:
    branches:
      - main
    paths:
      - ".github/perax-test-chunks/**"
      - ".github/workflows/assemble-reserve-tests.yml"

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Reconstruct expanded transaction test
        shell: bash
        run: |
          cat \
            .github/perax-test-chunks/test.b64.00 \
            .github/perax-test-chunks/test.b64.01 \
            .github/perax-test-chunks/test.b64.02 \
            .github/perax-test-chunks/test.b64.03 \
            .github/perax-test-chunks/test.b64.04.00 \
            .github/perax-test-chunks/test.b64.04.01 \
            .github/perax-test-chunks/test.b64.04.02 \
            .github/perax-test-chunks/test.b64.04.03 \
            .github/perax-test-chunks/test.b64.05 \
            | base64 --decode > perax-contracts/tests/perax-core.ts
          echo "a344ae35218b923a84c7b0152a52e4b950fde9fa7e76d229ae4a7d9ce3cdac6  perax-contracts/tests/perax-core.ts" | sha256sum --check
      - name: Commit final test and remove temporary files
        shell: bash
        run: |
          git rm -r .github/perax-test-chunks
          git rm .github/workflows/assemble-reserve-tests.yml
          git add perax-contracts/tests/perax-core.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: expand reserve vault transaction coverage'
          git push origin HEAD:main
