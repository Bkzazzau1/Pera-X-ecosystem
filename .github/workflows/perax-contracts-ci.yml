name: Pera-X Contracts CI

on:
  push:
    branches:
      - main
    paths:
      - "perax-contracts/**"
      - "perax-market-engine/**"
      - ".github/workflows/perax-contracts-ci.yml"
  pull_request:
    paths:
      - "perax-contracts/**"
      - "perax-market-engine/**"
      - ".github/workflows/perax-contracts-ci.yml"
  workflow_dispatch:

jobs:
  contracts:
    name: Build and transaction-test Anchor program
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: perax-contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reject tracked local key material
        shell: bash
        run: |
          tracked_secrets="$(
            git -C .. ls-files | grep -E '(^|/)\.local/|(^|/)(id|keypair|wallet|solana-wallet)\.json$|\.keypair\.json$' || true
          )"
          if [ -n "$tracked_secrets" ]; then
            echo "Tracked local or keypair-like files are forbidden:"
            echo "$tracked_secrets"
            exit 1
          fi

      - name: Set up Rust 1.79 contract toolchain
        uses: dtolnay/rust-toolchain@1.79.0
        with:
          components: rustfmt

      - name: Install Cargo toolchain for Anchor metadata
        shell: bash
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Cache Cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            perax-contracts/target
          key: ${{ runner.os }}-cargo-rust-1.79.0-agave-3.1.14-${{ hashFiles('perax-contracts/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rust-1.79.0-agave-3.1.14-
            ${{ runner.os }}-cargo-rust-1.79.0-

      - name: Install Agave CLI and SBF tools
        shell: bash
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.14/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        shell: bash
        run: |
          cargo +1.79.0 install \
            --git https://github.com/solana-foundation/anchor \
            --tag v0.30.1 \
            anchor-cli \
            --locked

      - name: Create ephemeral CI wallet
        shell: bash
        run: |
          mkdir -p .local
          solana-keygen new \
            --no-bip39-passphrase \
            --silent \
            --force \
            --outfile .local/devnet-deployer.json

      - name: Install exact JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit production JavaScript dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate tokenomics
        run: npm run validate:tokenomics

      - name: Validate settlement source guards
        run: npm run validate:settlement

      - name: Run planning scripts
        run: |
          npm run plan:allocation
          npm run plan:mint
          npm run plan:initialize
          node scripts/plan-fixed-supply-finalization.js
          node scripts/plan-allocation-execution.js
          node scripts/check-devnet-readiness.js
          node scripts/check-anchor-deploy-readiness.js

      - name: Build SBF program without Anchor IDL pass
        shell: bash
        run: |
          set -o pipefail
          RUSTUP_TOOLCHAIN=1.85.0 anchor build --no-idl 2>&1 | tee /tmp/anchor-build.log

      - name: Generate IDL through plain Rust metadata pass
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build-idl-safe.sh 2>&1 | tee -a /tmp/anchor-build.log

      - name: Upload generated contract interface
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perax-core-contract-interface
          path: |
            perax-contracts/target/idl/perax_core.json
            perax-contracts/target/types/perax_core.ts
          if-no-files-found: warn

      - name: Validate generated settlement IDL
        if: always()
        run: npm run validate:settlement-idl

      - name: Reject unsafe SBF stack frames
        if: always()
        shell: bash
        run: |
          if grep -E "Stack offset of [0-9]+ exceeded max offset|overwrites values in the frame" /tmp/anchor-build.log; then
            echo "Unsafe SBF stack-frame diagnostics were emitted. Box or split the affected Anchor account contexts before release."
            exit 1
          fi

      - name: Upload Anchor build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anchor-build-diagnostics
          path: /tmp/anchor-build.log
          if-no-files-found: warn

      - name: Run Rust unit tests
        run: cargo +1.79.0 test --locked --manifest-path programs/perax-core/Cargo.toml

      - name: Check Rust contracts
        run: cargo +1.79.0 check --locked --all-targets

      - name: TypeScript check
        run: npm run typecheck

      - name: Validate APC market engine
        working-directory: perax-market-engine
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Run local-validator transaction tests against existing build
        run: RUSTUP_TOOLCHAIN=1.85.0 anchor test --skip-build --provider.cluster localnet
