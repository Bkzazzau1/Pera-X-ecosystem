name: Pera-X Contracts CI

on:
  push:
    branches:
      - main
    paths:
      - "perax-contracts/**"
      - ".github/workflows/perax-contracts-ci.yml"
  pull_request:
    paths:
      - "perax-contracts/**"
      - ".github/workflows/perax-contracts-ci.yml"
  workflow_dispatch:

jobs:
  contracts:
    name: Validate and test Anchor contracts
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: perax-contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            perax-contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('perax-contracts/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Solana CLI
        shell: bash
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.18/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        shell: bash
        run: |
          cargo install --git https://github.com/coral-xyz/anchor --tag v0.30.1 anchor-cli --locked
          anchor --version

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Validate tokenomics
        run: npm run validate:tokenomics

      - name: Run planning scripts
        run: |
          npm run plan:allocation
          npm run plan:mint
          npm run plan:initialize
          node scripts/plan-fixed-supply-finalization.js
          node scripts/plan-allocation-execution.js

      - name: TypeScript check
        run: npm run typecheck

      - name: Generate local Solana keypair
        shell: bash
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase --silent --outfile ~/.config/solana/id.json
          solana config set --url localhost

      - name: Run Anchor tests
        run: anchor test
