name: Update Vault Precreation Guard

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'verify/apc-settlement-completion-20260719'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify/apc-settlement-completion-20260719
          fetch-depth: 0
      - name: Require precreation plus on-chain custody validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('perax-contracts/scripts/validate-settlement-source.js')
          text = path.read_text()
          old = '''assertContains(
            contexts,
            "associated_token::authority = settlement_authority",
            "settlement_v2.rs",
          );'''
          new = '''assertNotContains(
            contexts,
            "associated_token::authority = settlement_authority",
            "settlement_v2.rs planning context",
          );
          assertContains(
            handlers,
            "settlement_pex_vault.owner == ctx.accounts.settlement_authority.key()",
            "settlement custody handler",
          );
          assertContains(
            handlers,
            "settlement_pex_vault.mint == ctx.accounts.pex_mint.key()",
            "settlement custody handler",
          );
          assertContains(
            anchorClient,
            "addresses.settlementAuthority",
            "Anchor settlement vault precreation",
          );'''
          if new not in text:
              if old not in text:
                  raise SystemExit('Old settlement ATA guard was not found')
              path.write_text(text.replace(old, new, 1))
          PY
          node --check perax-contracts/scripts/validate-settlement-source.js
          git add perax-contracts/scripts/validate-settlement-source.js
          if git diff --cached --quiet; then
            echo 'Vault precreation guard is already current.'
            exit 0
          fi
          git config user.name 'Pera-X verification automation'
          git config user.email 'actions@github.com'
          git commit -m 'Guard pre-created settlement custody vaults'
          git push origin HEAD:verify/apc-settlement-completion-20260719
