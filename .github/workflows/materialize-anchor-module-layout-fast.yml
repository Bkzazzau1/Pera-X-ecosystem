name: Materialize Anchor Module Layout Fast

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'verify/apc-settlement-completion-20260719'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: verify/apc-settlement-completion-20260719
          fetch-depth: 0

      - name: Set up Rust 1.79
        uses: dtolnay/rust-toolchain@1.79.0
        with:
          components: rustfmt

      - name: Move market validator into normal module tree
        run: |
          if [ -f perax-contracts/programs/perax-core/src/market_cpi.rs ]; then
            git mv \
              perax-contracts/programs/perax-core/src/market_cpi.rs \
              perax-contracts/programs/perax-core/src/instructions/market_cpi.rs
          fi
          python3 - <<'PY'
          from pathlib import Path

          modules = Path('perax-contracts/programs/perax-core/src/instructions/mod.rs')
          text = modules.read_text()
          text = text.replace('#[path = "../market_cpi.rs"]\nmod market_cpi;', 'mod market_cpi;')
          modules.write_text(text)

          guard = Path('perax-contracts/scripts/validate-hardened-market-source.js')
          text = guard.read_text()
          text = text.replace(
              'programs/perax-core/src/market_cpi.rs',
              'programs/perax-core/src/instructions/market_cpi.rs',
          )
          guard.write_text(text)
          PY

      - name: Verify Rust and source guards
        working-directory: perax-contracts
        run: |
          cargo +1.79.0 fmt --all
          cargo +1.79.0 fmt --all -- --check
          cargo +1.79.0 test --locked --all-targets
          cargo +1.79.0 check --locked --all-targets
          npm ci --ignore-scripts --no-audit --no-fund
          npm run validate:settlement

      - name: Commit Anchor-compatible module layout
        run: |
          git add \
            perax-contracts/programs/perax-core/src \
            perax-contracts/scripts/validate-hardened-market-source.js
          if git diff --cached --quiet; then
            echo 'Anchor-compatible module layout is already present.'
            exit 0
          fi
          git config user.name 'Pera-X verification automation'
          git config user.email 'actions@github.com'
          git commit -m 'Use Anchor-compatible market validator module layout'
          git push origin HEAD:verify/apc-settlement-completion-20260719
