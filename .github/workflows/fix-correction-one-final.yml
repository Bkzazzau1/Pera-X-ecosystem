name: Validate final correction-one patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-correction-one-final.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/correction-one-trigger.txt"
      - ".github/scripts/fix-correction-one-final.py"
      - ".github/workflows/fix-correction-one-final.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.79.0
        with:
          components: rustfmt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Apply guarded source patch
        run: python .github/scripts/fix-correction-one-final.py

      - name: Declare Rust 1.79 support and regenerate lockfile
        working-directory: perax-contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("programs/perax-core/Cargo.toml")
          text = path.read_text()
          marker = 'edition = "2021"\n'
          replacement = 'edition = "2021"\nrust-version = "1.79"\n'
          if text.count(marker) != 1 or 'rust-version = ' in text:
              raise SystemExit("Unexpected perax-core Cargo.toml rust-version state")
          path.write_text(text.replace(marker, replacement))
          PY
          rustup toolchain install 1.85.0 --profile minimal
          rm Cargo.lock
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback \
            cargo +1.85.0 generate-lockfile
          cargo +1.85.0 tree --locked -i solana-program > /tmp/correction-one-cargo-tree.log

      - name: Install TypeScript dependencies
        working-directory: perax-contracts
        run: npm install

      - name: Verify TypeScript
        working-directory: perax-contracts
        run: npm run typecheck

      - name: Format and verify Rust
        working-directory: perax-contracts
        run: |
          cargo +1.79.0 fmt --all
          cargo +1.79.0 fmt --all -- --check

      - name: Run Rust unit tests with pinned toolchain
        working-directory: perax-contracts
        shell: bash
        run: |
          set +e
          cargo +1.79.0 test --locked --all-targets 2>&1 | tee /tmp/correction-one-cargo-test.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Check Rust contracts
        working-directory: perax-contracts
        run: cargo +1.79.0 check --locked --all-targets

      - name: Upload validation files and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: correction-one-validation-output
          path: |
            perax-contracts/Cargo.lock
            perax-contracts/programs/perax-core/Cargo.toml
            perax-contracts/programs/perax-core/src/instructions/vault.rs
            perax-contracts/tests/perax-core.ts
            /tmp/correction-one-cargo-tree.log
            /tmp/correction-one-cargo-test.log
          if-no-files-found: error
