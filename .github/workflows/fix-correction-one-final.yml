name: Validate final correction-one patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-correction-one-final.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/correction-one-trigger.txt"
      - ".github/scripts/fix-correction-one-final.py"
      - ".github/workflows/fix-correction-one-final.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.79.0
        with:
          components: rustfmt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Apply guarded source patch
        run: python .github/scripts/fix-correction-one-final.py

      - name: Install TypeScript dependencies
        working-directory: perax-contracts
        run: npm install

      - name: Verify TypeScript
        working-directory: perax-contracts
        run: npm run typecheck

      - name: Format and verify Rust
        working-directory: perax-contracts
        run: |
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Run Rust unit tests
        working-directory: perax-contracts
        shell: bash
        run: |
          set +e
          cargo test --all-targets 2>&1 | tee /tmp/correction-one-cargo-test.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Check Rust contracts
        working-directory: perax-contracts
        run: cargo check --all-targets

      - name: Upload validation files and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: correction-one-validation-output
          path: |
            perax-contracts/programs/perax-core/src/instructions/vault.rs
            perax-contracts/tests/perax-core.ts
            /tmp/correction-one-cargo-test.log
          if-no-files-found: error
