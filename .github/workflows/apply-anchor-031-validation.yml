name: Validate Anchor 0.31 Upgrade

on:
  push:
    branches: [agent/apc-policy-v1]
    paths:
      - ".github/scripts/apply-anchor-031-validation.py"
      - ".github/workflows/apply-anchor-031-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/apply-anchor-031-validation.py"
      - ".github/workflows/apply-anchor-031-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apc-policy-v1
          fetch-depth: 0
      - name: Apply guarded Anchor upgrade
        shell: bash
        run: python3 .github/scripts/apply-anchor-031-validation.py 2>&1 | tee /tmp/anchor-upgrade-transform.log
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt
      - name: Install Rust 1.89 for Anchor CLI compilation
        shell: bash
        run: rustup toolchain install 1.89.0 --profile minimal
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Regenerate compatible Rust and npm locks
        shell: bash
        run: |
          set -o pipefail
          cd perax-contracts
          rm -f Cargo.lock
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo +1.85.0 generate-lockfile 2>&1 | tee /tmp/anchor-upgrade-lock.log
          cargo +1.85.0 update -p blake3 --precise 1.5.5
          npm install
      - name: Install Agave 2.1.0
        shell: bash
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor CLI 0.31.1
        shell: bash
        run: |
          set -o pipefail
          cargo +1.89.0 install \
            --git https://github.com/solana-foundation/anchor \
            --tag v0.31.1 \
            anchor-cli \
            --locked \
            --force 2>&1 | tee /tmp/anchor-upgrade-cli-install.log
          anchor --version
      - name: Create ephemeral local-validator wallet
        working-directory: perax-contracts
        run: |
          mkdir -p .local
          solana-keygen new --no-bip39-passphrase --silent --force --outfile .local/devnet-deployer.json
      - name: Validate source and policy synchronization
        working-directory: perax-contracts
        shell: bash
        run: |
          set -o pipefail
          npm run simulate:apc-policy-v1
          npm run validate:tokenomics
          npm run typecheck
          cargo +1.85.0 fmt --all
          cargo +1.85.0 fmt --all -- --check
          cargo +1.85.0 test --locked --all-targets 2>&1 | tee /tmp/anchor-upgrade-rust-tests.log
          cargo +1.85.0 check --locked --all-targets 2>&1 | tee /tmp/anchor-upgrade-rust-check.log
          cd ../perax-market-engine
          npm ci
          npm run typecheck
          npm test
      - name: Build SBF program and reject unsafe stack frames
        working-directory: perax-contracts
        shell: bash
        run: |
          set -o pipefail
          RUSTUP_TOOLCHAIN=1.85.0 anchor build 2>&1 | tee /tmp/anchor-upgrade-build.log
          if grep -E 'Stack offset of [0-9]+ exceeded max offset of 4096|Stack frame size of [0-9]+ exceeded max allowed size of 4096|overwrites values in the frame' /tmp/anchor-upgrade-build.log; then
            echo 'Unsafe SBF stack frame detected.'
            exit 1
          fi
      - name: Compare deterministic IDL and inspect sizes
        working-directory: perax-contracts
        shell: bash
        run: |
          cp target/idl/perax_core.json /tmp/perax_core.first.json
          RUSTUP_TOOLCHAIN=1.85.0 anchor build >/tmp/anchor-upgrade-build-second.log 2>&1
          cmp /tmp/perax_core.first.json target/idl/perax_core.json
          npm run check:build-sizes
          cargo +1.85.0 test --locked apc_account_size_report_and_limits -- --nocapture 2>&1 | tee /tmp/anchor-upgrade-account-sizes.log
          mkdir -p idl
          cp target/idl/perax_core.json idl/perax_core.json
      - name: Run local-validator transaction suite
        working-directory: perax-contracts
        shell: bash
        run: RUSTUP_TOOLCHAIN=1.85.0 anchor test --skip-build --provider.cluster localnet 2>&1 | tee /tmp/anchor-upgrade-local-validator.log
      - name: Write validation report
        shell: bash
        run: |
          program_bytes="$(stat -c%s perax-contracts/target/deploy/perax_core.so)"
          idl_bytes="$(stat -c%s perax-contracts/target/idl/perax_core.json)"
          cat > docs/APC_POLICY_V1_BUILD_VALIDATION.md <<EOF
          # APC Policy V1 Build Validation

          - Anchor: 0.31.1
          - Agave: 2.1.0
          - Rust host: 1.85.0
          - Program size: ${program_bytes} bytes
          - IDL size: ${idl_bytes} bytes
          - Unsafe 4 KB stack-frame scan: passed
          - Deterministic IDL comparison: passed
          - Rust unit/property tests: passed
          - TypeScript and market-engine tests: passed
          - Anchor local-validator transaction suite: passed

          No deployment, initialization, migration, reserve transfer or production asset movement occurred. Independent external security review remains required before source freeze or deployment approval.
          EOF
      - name: Commit validated upgrade source
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git diff --check
          git add perax-contracts/Anchor.toml \
                  perax-contracts/Cargo.lock \
                  perax-contracts/package.json \
                  perax-contracts/package-lock.json \
                  perax-contracts/programs/perax-core/Cargo.toml \
                  perax-contracts/programs/perax-core/src/tests.rs \
                  perax-contracts/scripts/check-build-sizes.js \
                  perax-contracts/idl/perax_core.json \
                  docs/APC_POLICY_V1_BUILD_VALIDATION.md
          git config user.name "Pera-X validation automation"
          git config user.email "actions@github.com"
          git commit -m "Upgrade APC validation to Anchor 0.31.1"
          git push origin agent/apc-policy-v1
      - name: Upload upgrade validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anchor-031-apc-policy-v1-evidence
          path: |
            /tmp/anchor-upgrade-transform.log
            /tmp/anchor-upgrade-lock.log
            /tmp/anchor-upgrade-cli-install.log
            /tmp/anchor-upgrade-rust-tests.log
            /tmp/anchor-upgrade-rust-check.log
            /tmp/anchor-upgrade-build.log
            /tmp/anchor-upgrade-build-second.log
            /tmp/anchor-upgrade-account-sizes.log
            /tmp/anchor-upgrade-local-validator.log
            /tmp/perax-build-sizes.json
            perax-contracts/target/idl/perax_core.json
            perax-contracts/target/deploy/perax_core.so
          if-no-files-found: warn
