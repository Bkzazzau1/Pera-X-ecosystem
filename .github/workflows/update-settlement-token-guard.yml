name: Update Settlement Token Guards

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-settlement-token-guard.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update permanent validator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one source match, found {count}")
              return text.replace(old, new, 1)

          path = Path("perax-contracts/scripts/validate-settlement-source.js")
          source = path.read_text(encoding="utf-8")
          source = replace_once(
              source,
              '''const runtimeBootstrap = read("../perax-market-engine/src/start-executor.ts");\nconst marketIndex = read("../perax-market-engine/src/index.ts");\n''',
              '''const runtimeBootstrap = read("../perax-market-engine/src/start-executor.ts");\nconst tokenUtilities = read("../perax-market-engine/src/token.ts");\nconst marketIndex = read("../perax-market-engine/src/index.ts");\n''',
              "token utility source",
          )
          source = replace_once(
              source,
              '''assertContains(marketPackage, '"@coral-xyz/anchor": "0.30.1"', "market-engine package");\nassertContains(marketPackage, '"@solana/spl-token": "^0.4.8"', "market-engine package");\nassertContains(marketPackage, '"build": "tsc"', "market-engine package");\n''',
              '''assertContains(marketPackage, '"@coral-xyz/anchor": "0.30.1"', "market-engine package");\nassertNotContains(marketPackage, '"@solana/spl-token"', "market-engine package");\nassertContains(marketPackage, '"uuid": "11.1.1"', "market-engine package");\nassertContains(marketPackage, '"build": "tsc"', "market-engine package");\n''',
              "market package dependency guards",
          )
          source = replace_once(
              source,
              '''assertContains(marketLock, '"node_modules/@coral-xyz/anchor"', "market-engine lock");\nassertContains(marketLock, '"node_modules/@solana/spl-token"', "market-engine lock");\n\nassertContains(marketIndex, 'export * from "./executor.js";', "market-engine index");\n''',
              '''assertContains(marketLock, '"node_modules/@coral-xyz/anchor"', "market-engine lock");\nassertNotContains(marketLock, '"node_modules/@solana/spl-token"', "market-engine lock");\nassertNotContains(marketLock, '"node_modules/bigint-buffer"', "market-engine lock");\n\nassertContains(tokenUtilities, "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA", "token utilities");\nassertContains(tokenUtilities, "ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL", "token utilities");\nassertContains(tokenUtilities, "PublicKey.findProgramAddressSync", "token utilities");\nassertContains(tokenUtilities, "Buffer.from([1])", "token utilities");\nassertContains(tokenUtilities, "SystemProgram.programId", "token utilities");\nassertContains(anchorClient, '} from "./token.js";', "Anchor settlement client");\nassertNotContains(anchorClient, 'from "@solana/spl-token"', "Anchor settlement client");\n\nassertContains(marketIndex, 'export * from "./executor.js";', "market-engine index");\n''',
              "lock and local token guards",
          )
          source = replace_once(
              source,
              '''assertContains(marketIndex, 'export * from "./start-executor.js";', "market-engine index");\n\nconsole.log("Settlement source guards passed.");\n''',
              '''assertContains(marketIndex, 'export * from "./start-executor.js";', "market-engine index");\nassertContains(marketIndex, 'export * from "./token.js";', "market-engine index");\n\nconsole.log("Settlement source guards passed.");\n''',
              "market index token export",
          )
          path.write_text(source, encoding="utf-8")
          PY

      - name: Run permanent settlement source guard
        working-directory: perax-contracts
        run: node scripts/validate-settlement-source.js

      - name: Commit verified guard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add perax-contracts/scripts/validate-settlement-source.js
          git commit -m "Guard audited local token account utilities"
          git push origin HEAD:main
