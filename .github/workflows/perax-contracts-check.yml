name: Pera-X Contracts Check

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: perax-contracts/package.json

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: perax-contracts

      - name: Check Rust version
        run: |
          rustc --version
          cargo --version

      - name: Install TypeScript dependencies
        working-directory: perax-contracts
        run: npm install

      - name: Typecheck Anchor TypeScript tests
        working-directory: perax-contracts
        run: npm run typecheck

      - name: Normalize formatting
        working-directory: perax-contracts
        run: cargo fmt --all

      - name: Run smart contract unit tests
        working-directory: perax-contracts
        run: cargo test --all-targets

      - name: Check Pera-X contracts
        working-directory: perax-contracts
        run: cargo check --all-targets
