name: Pera-X Contracts Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "perax-contracts/**"
      - ".github/workflows/perax-contracts-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "perax-contracts/**"
      - ".github/workflows/perax-contracts-check.yml"

jobs:
  check-contracts:
    name: Typecheck and Rust preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.79.0
        with:
          components: rustfmt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: perax-contracts
          key: rust-1.79.0

      - name: Check tool versions
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Install TypeScript dependencies
        working-directory: perax-contracts
        run: npm install

      - name: Typecheck Anchor TypeScript tests
        working-directory: perax-contracts
        run: npm run typecheck

      - name: Check Rust formatting
        working-directory: perax-contracts
        run: cargo fmt --all -- --check

      - name: Run smart contract unit tests
        working-directory: perax-contracts
        run: cargo test --all-targets

      - name: Check Pera-X contracts
        working-directory: perax-contracts
        run: cargo check --all-targets
