name: Pera-X Contracts CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Validate tokenomics and test Anchor program
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: perax-contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: perax-contracts/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: perax-contracts

      - name: Install Solana CLI
        uses: solana-program/actions/install-solana@v1
        with:
          solana-version: stable

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.30.1
          avm use 0.30.1
          echo "$HOME/.avm/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: npm install

      - name: Validate tokenomics
        run: npm run validate:tokenomics

      - name: Typecheck scripts
        run: npm run typecheck

      - name: Run Anchor tests
        run: anchor test
