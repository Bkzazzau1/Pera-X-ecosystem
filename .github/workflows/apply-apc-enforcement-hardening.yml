name: Apply APC enforcement hardening

on:
  push:
    branches: [agent/apc-enforcement-hardening]
    paths:
      - ".github/scripts/apply-apc-enforcement-hardening.py"
      - ".github/workflows/apply-apc-enforcement-hardening.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/apply-apc-enforcement-hardening.py"
      - ".github/workflows/apply-apc-enforcement-hardening.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: agent/apc-enforcement-hardening
          fetch-depth: 0

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.79.0
        with:
          components: rustfmt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Preserve guarded patch driver
        shell: bash
        run: |
          cp .github/scripts/apply-apc-enforcement-hardening.py /tmp/apply-apc-enforcement-hardening.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply-apc-enforcement-hardening.py')
          text = path.read_text()
          root_old = 'ROOT = Path(__file__).resolve().parents[2]'
          if text.count(root_old) != 1:
              raise SystemExit('unexpected hardening root declaration')
          text = text.replace(root_old, 'ROOT = Path.cwd()')
          old = '''    if marker not in text:\n        raise SystemExit(f"{relative}: insertion marker not found")\n    path.write_text(text.replace(marker, addition + marker, 1))\n'''
          new = '''    if marker == "":\n        path.write_text(text + addition)\n        return\n    if marker not in text:\n        raise SystemExit(f"{relative}: insertion marker not found")\n    path.write_text(text.replace(marker, addition + marker, 1))\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected append_once helper')
          path.write_text(text.replace(old, new))
          PY

      - name: Apply guarded source hardening
        shell: bash
        run: |
          set -o pipefail
          python3 /tmp/apply-apc-enforcement-hardening.py 2>&1 | tee /tmp/hardening-apply.log

      - name: Validate tokenomics
        working-directory: perax-contracts
        run: node scripts/validate-tokenomics.js

      - name: Format and test Rust
        working-directory: perax-contracts
        shell: bash
        run: |
          cargo +1.79.0 fmt --all
          cargo +1.79.0 fmt --all -- --check
          cargo +1.79.0 test --locked --all-targets 2>&1 | tee /tmp/hardening-rust-test.log
          cargo +1.79.0 check --locked --all-targets 2>&1 | tee /tmp/hardening-rust-check.log

      - name: Typecheck Anchor tests
        working-directory: perax-contracts
        run: |
          npm install
          npm run typecheck 2>&1 | tee /tmp/hardening-typescript.log

      - name: Validate APC market engine
        working-directory: perax-market-engine
        run: |
          npm install
          npm run typecheck
          npm test

      - name: Commit and push validated source
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          git diff --check
          git add \
            docs/APC_LOGIC_SPECIFICATION.md \
            perax-contracts/config/pex-tokenomics.json \
            perax-contracts/programs/perax-core/src/contexts.rs \
            perax-contracts/programs/perax-core/src/errors.rs \
            perax-contracts/programs/perax-core/src/instructions/apc.rs \
            perax-contracts/programs/perax-core/src/instructions/counterweight.rs \
            perax-contracts/programs/perax-core/src/instructions/recovery.rs \
            perax-contracts/programs/perax-core/src/state.rs \
            perax-contracts/programs/perax-core/src/tests.rs \
            perax-contracts/programs/perax-core/src/validation.rs \
            perax-contracts/scripts/validate-tokenomics.js \
            perax-contracts/tests/perax-core.ts
          git config user.name "Pera-X APC automation"
          git config user.email "actions@github.com"
          git commit -m "Harden APC enforcement controls"
          git push origin agent/apc-enforcement-hardening

      - name: Upload hardening diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apc-enforcement-hardening-diagnostics
          path: |
            /tmp/hardening-apply.log
            /tmp/hardening-rust-test.log
            /tmp/hardening-rust-check.log
            /tmp/hardening-typescript.log
          if-no-files-found: warn
